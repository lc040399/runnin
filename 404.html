<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Siden findes ikke - Runnin</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/assets/mark.png">
<style>
  body { margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:#F5F3EE; color:#38240D; font-family:"Inter Tight",-apple-system,sans-serif; text-align:center; }
  .boks { padding:32px; animation: op .5s cubic-bezier(.22,1,.36,1) both; }
  @keyframes op { from { opacity:0; transform:translateY(10px);} to { opacity:1; } }
  img { width:56px; height:56px; }
  h1 { font-size:26px; margin:18px 0 8px; font-weight:800; }
  p { color:#7E6A50; font-size:15px; margin:0 0 22px; }
  a { display:inline-block; background:#C05800; color:#fff; text-decoration:none; font-weight:700;
    padding:13px 26px; border-radius:999px; font-size:14px; }
</style>
</head>
<body>
<div class="boks">
  <img src="/assets/mark.png" alt="">
  <h1>Du er løbet af ruten.</h1>
  <p>Siden findes ikke - men der venter 6.500 løb på kortet.</p>
  <a href="/">Tilbage til kortet</a>
</div>
</body>
</html>
