name: Runnin
options:
  bundleIdPrefix: dk.runnin
  deploymentTarget:
    iOS: "16.0"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: "6.0.0"
targets:
  Runnin:
    type: application
    platform: iOS
    sources:
      - Runnin
      - Delt
      - path: StoryAssets
        type: folder
        buildPhase: resources
    dependencies:
      - package: MapLibre
      - target: RunninWidget
    info:
      path: Runnin/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: dk.runnin.auth
            CFBundleURLSchemes: [runnin]
        LSApplicationQueriesSchemes: [instagram-stories, instagram]
        NSPhotoLibraryAddUsageDescription: "Save your race story to share it on Instagram or anywhere else."
    entitlements:
      path: Runnin/Runnin.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:runnin.org"]
        aps-environment: development
        com.apple.security.application-groups: [group.dk.runnin.ap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.runnin.ap
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Runnin
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "64R255UR26"
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "15"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Runnin uses your location to center the map on races near you."

  RunninWidget:
    type: app-extension
    platform: iOS
    sources:
      - RunninWidget
      - Delt
    info:
      path: RunninWidget/Info.plist
      properties:
        CFBundleDisplayName: Runnin
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: RunninWidget/RunninWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dk.runnin.ap]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.runnin.ap.widget
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "64R255UR26"
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "15"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
