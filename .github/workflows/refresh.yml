# Ugentlig data-refresh: genimportér løbskilderne, valider at intet katalog
# kollapser, stempl "sidst opdateret" og deploy. Kør den MANUELT (workflow_dispatch)
# første gang og hold øje - kræver Cloudflare-hemmeligheder (se noter nederst).
name: Data-refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # mandag 04:00 UTC

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # wrangler@latest kræver >=22

      # GeoNames zip-database til US-geokodning (gratis, ~5 MB) - gør build-rsu CI-bar
      - name: Hent GeoNames US.txt
        continue-on-error: true
        run: |
          curl -sf -o /tmp/US.zip https://download.geonames.org/export/zip/US.zip \
            && unzip -o -q /tmp/US.zip -d /tmp && ls -la /tmp/US.txt \
            || echo "::warning::GeoNames-download fejlede - build-rsu springes over"

      # Kilderne kører hver for sig - én død kilde må ikke vælte de andre.
      # (De skriver kun deres egen data/*.js; fejler de, beholder git den gamle.)
      - name: Genimportér kilder
        continue-on-error: true
        run: |
          set +e
          # per-kilde timeout: en hængende kilde dræbes, de andre kører videre
          for p in build-st build-rid build-kondis build-wm build-aims build-toplister build-eq-toplister; do
            echo "::group::$p"
            timeout 360 node "tools/$p.mjs"
            rc=$?
            [ $rc -eq 124 ] && echo "::warning::$p timeout (>6 min) - beholder eksisterende data"
            [ $rc -ne 0 ] && [ $rc -ne 124 ] && echo "::warning::$p fejlede (exit $rc) - beholder eksisterende data"
            echo "::endgroup::"
          done
          # US (5.200+ løb, langsommere kilde) - kun hvis GeoNames-databasen kom ned
          if [ -f /tmp/US.txt ]; then
            echo "::group::build-rsu"
            timeout 900 node tools/build-rsu.mjs || echo "::warning::build-rsu fejlede/timeout - beholder eksisterende data"
            echo "::endgroup::"
          fi
          # DK land-validering efter Sportstiming-høst (bælte & seler oven på adresse-median)
          timeout 360 node tools/fix-coords.mjs || echo "::warning::fix-coords fejlede"

      - name: Valider parse (gendan sidste gode ved halvskrevet fil)
        run: |
          for f in data/races*.js; do
            node --check "$f" 2>/dev/null || { echo "::warning::$f parser ikke - gendanner sidste gode"; git checkout -- "$f"; }
          done
          if [ -f data/toplister.json ]; then
            node -e "JSON.parse(require('fs').readFileSync('data/toplister.json','utf8'))" 2>/dev/null \
              || { echo "::warning::toplister.json ugyldig - gendanner"; git checkout -- data/toplister.json; }
          fi

      - name: Krympe-vagt (afbryd hvis en datafil kollapser)
        run: |
          fejl=0
          for f in data/races*.js; do
            old=$(git show "HEAD:$f" 2>/dev/null | wc -c || echo 0)
            new=$(wc -c < "$f")
            if [ "$old" -gt 0 ] && [ "$new" -lt $((old / 2)) ]; then
              echo "::error::$f skrumpede fra $old til $new bytes - afbryder deploy"
              fejl=1
            fi
          done
          [ "$fejl" -eq 0 ] || exit 1

      # races.json/geojson er appens OTA-data - SKAL genbygges, ellers rådner native-appen
      - name: Byg delt datalag (races.json til app-OTA)
        run: |
          node tools/build-json.mjs
          node -e "const a=JSON.parse(require('fs').readFileSync('data/races.json','utf8')); if(a.length<3000) { console.error('races.json kollapset:', a.length); process.exit(1); } console.log('races.json OK:', a.length, 'løb');"

      - name: Stempl sidst-opdateret
        run: node tools/build-meta.mjs

      - name: Commit data-ændringer
        run: |
          git config user.name "runnin-bot"
          git config user.email "bot@runnin.org"
          git add data/
          git commit -m "chore: ugentlig data-refresh [skip ci]" || { echo "ingen ændringer"; exit 0; }
          git push

      # deploy via deploy.sh (bygger dist/ MED SEO-sider + functions - rå rod-deploy
      # smed /lob/-siderne af sitet ved hver refresh)
      - name: Deploy til Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash tools/deploy.sh

# ---------------------------------------------------------------------------
# KRÆVER at Lasse lægger to repo-hemmeligheder ind (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   - token m. "Cloudflare Pages: Edit"-rettighed
#   CLOUDFLARE_ACCOUNT_ID  - konto-id (står i Cloudflare-dashboardets URL/sidepanel)
# Uden dem kører refresh + commit fint, men deploy-trinnet fejler.
# Kør workflowet manuelt (Actions → Data-refresh → Run) første gang og se loggen.
