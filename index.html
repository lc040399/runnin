<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runnin - Find dit næste løb</title>
<meta name="description" content="Hele verdens løb på ét kort. Find dit næste marathon, halvmarathon, trail eller triathlon - og tilmeld dig på den officielle side.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='9' fill='%23C05800'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%2338240D' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link href="css/style.css?v=22" rel="stylesheet">
</head>
<body>

<div id="map" aria-label="Verdenskort med løb"></div>

<!-- Top nav -->
<header class="nav reveal">
  <div class="brand">RUNNIN</div>
  <div class="nav-right">
    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="kort">Kort</button>
      <button class="tab" data-tab="lob">Kommende løb</button>
      <button class="tab" data-tab="mine">Mine løb <span class="fav-count" id="favCount" hidden></span></button>
    </nav>
    <button class="login-btn" id="loginBtn">Log ind</button>
    <button class="user-chip" id="userChip" hidden>
      <span class="user-avatar" id="userAvatar"></span>
      <span class="user-name" id="userName"></span>
    </button>
    <div class="profile-menu" id="profileMenu" hidden></div>
  </div>
</header>

<!-- Login-sheet (demo: gemmes lokalt i browseren) -->
<div id="loginOverlay" class="login-overlay" hidden>
  <div class="login-modal">
    <button class="close" id="loginClose" aria-label="Luk">✕</button>
    <div class="d-type">Runnin-profil</div>
    <h2 class="login-title" id="loginTitle">Log ind</h2>
    <form id="loginForm">
      <label class="login-label" for="loginName">Navn</label>
      <input class="login-field" id="loginName" placeholder="Dit fulde navn" autocomplete="name" value="Lasse Christensen">
      <div id="pwWrap">
        <label class="login-label" for="loginPw">Adgangskode</label>
        <input class="login-field" id="loginPw" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <label class="login-label" for="loginEmail">E-mail</label>
      <input class="login-field" id="loginEmail" type="email" placeholder="dig@mail.dk" autocomplete="email">
      <button class="cta login-cta" type="submit">Fortsæt <span>→</span></button>
      <button class="save" type="button" id="logoutBtn" hidden>Log ud</button>
      <p class="foto-note">Demo: gemmes kun lokalt i din browser - ingen konto oprettes.</p>
    </form>
  </div>
</div>

<!-- Hero + filtre -->
<section class="hero reveal-2">
  <h1>Find dit næste løb.</h1>
  <p class="sub">Hele verden. Hele året.</p>
  <div class="search-wrap">
    <input class="search" id="search" placeholder="🔎 Søg løb eller by…" autocomplete="off">
    <div class="search-menu" id="searchMenu" hidden></div>
  </div>
  <div class="pills" id="pills">
    <div class="pill-wrap">
      <button class="pill" data-menu="region">Hvor som helst <span class="caret">▾</span></button>
      <div class="menu" data-for="region"></div>
    </div>
    <div class="pill-wrap">
      <button class="pill" data-menu="month">Når som helst <span class="caret">▾</span></button>
      <div class="menu" data-for="month"></div>
    </div>
    <div class="pill-wrap">
      <button class="pill" data-menu="type">Alle distancer <span class="caret">▾</span></button>
      <div class="menu" data-for="type"></div>
    </div>
    <button class="pill" id="nearBtn">📍 Nær mig</button>
  </div>
  <button class="live-pill" id="livePill" hidden></button>
</section>

<!-- LIVE-panel -->
<aside id="livePanel" class="panel live-panel" hidden></aside>

<!-- Hover-card -->
<div id="hoverCard" class="hover-card" hidden></div>

<!-- Detaljepanel -->
<aside id="detail" class="detail" hidden>
  <button class="close" id="detailClose" aria-label="Luk">✕</button>
  <div class="d-type" id="dType"></div>
  <h2 id="dName"></h2>
  <div class="d-meta" id="dMeta"></div>
  <div class="d-extra" id="dWeather"></div>
  <div class="d-extra" id="dFriends"></div>
  <div class="d-note" id="dNote" hidden></div>
  <button id="dLive" class="cta d-live" hidden><i class="live-dot"></i> Følg løbet live</button>
  <a id="dCta" class="cta" target="_blank" rel="noopener">Tilmeld på officiel side <span>→</span></a>
  <button id="dEntry" class="save d-entry">🎟 Markér som tilmeldt</button>
  <div class="d-actions">
    <button id="dSave"><i>♡</i><span>Gem</span></button>
    <button id="dAlarm"><i>🔔</i><span>Alarm</span></button>
    <button id="dPlan"><i>🎯</i><span>Sæson</span></button>
    <button id="dPhotos"><i>📷</i><span>Fotos</span></button>
  </div>
</aside>

<!-- Feature-modal (alarmer, radarer, planlægger, løbs-år) -->
<div id="featOverlay" class="cal-overlay" hidden>
  <div class="cal-modal"></div>
</div>

<!-- Foto-overlay -->
<div id="fotoOverlay" class="foto-overlay" hidden></div>

<!-- Dashboard -->
<div id="dashOverlay" class="foto-overlay dash-overlay" hidden></div>

<!-- Liste-panel (Løb / Mine løb) -->
<aside id="panel" class="panel" hidden>
  <div class="panel-head">
    <h2 id="panelTitle">Kommende løb</h2>
    <div class="panel-actions">
      <button class="icon-btn" id="calToggle" aria-label="Kalendervisning" title="Kalendervisning" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      </button>
      <button class="close" id="panelClose" aria-label="Luk">✕</button>
    </div>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<!-- Kalender-modal -->
<div id="calOverlay" class="cal-overlay" hidden>
  <div class="cal-modal"></div>
</div>

<!-- Legend + tæller -->
<footer class="footbar reveal-3">
  <div class="legend">
    <span><i style="background:#2563EB"></i>Kort (5-15 km)</span>
    <span><i style="background:#16A34A"></i>Half</span>
    <span><i style="background:#C05800"></i>Marathon</span>
    <span><i style="background:#7C3AED"></i>Ultra &amp; trail</span>
    <span><i style="background:#38240D"></i>Triathlon</span>
  </div>
  <div class="counter" id="counter"></div>
</footer>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="data/races.js?v=22"></script>
<script src="data/races-st.js?v=22"></script>
<script src="js/photos.js?v=22"></script>
<script src="js/app.js?v=22"></script>
<script src="js/features.js?v=22"></script>
<script src="js/connect.js?v=22"></script>
<script src="js/dashboard.js?v=22"></script>
<script src="js/live.js?v=22"></script>
</body>
</html>
